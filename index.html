<!DOCTYPE html>
<html>

<head>
    <meta charset='utf-8' />
    <title>Mapbox Storytelling</title>
    <meta name='viewport' content='initial-scale=1,maximum-scale=1,user-scalable=no' />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@400;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon"
        href="https://raw.githubusercontent.com/mapbox/assembly/publisher-staging/src/svgs/mapbox.svg">
<!--    <script src='https://api.tiles.mapbox.com/mapbox-gl-js/v3.8.0/mapbox-gl.js'></script>-->
<!--    <link href='https://api.tiles.mapbox.com/mapbox-gl-js/v3.8.0/mapbox-gl.css' rel='stylesheet' />-->
    <script src='https://api.tiles.mapbox.com/mapbox-gl-js/v3.18.1/mapbox-gl.js'></script>
    <link href='https://api.tiles.mapbox.com/mapbox-gl-js/v3.18.1/mapbox-gl.css' rel='stylesheet' />
    <script src="https://cdn.jsdelivr.net/npm/mapbox-gl-globe-minimap@1.2.0/dist/bundle.js"></script>
    <script src="https://unpkg.com/scrollama"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Newsreader", "Newsreader Fallback", serif;
        }

        h1, h2, h3, h4#footer {
            font-family: 'Playfair Display', serif;
        }

        h4 {
            font-weight: lighter !important;
            font-style: italic;
        }

        a.mapboxgl-ctrl-logo {
            display: none !important;
        }
        a:hover,
        a:visited {
            color: #0071bc;
        }

        #map {
            top: 0;
            height: 100vh;
            width: 100vw;
            position: fixed;
        }

        #header {
            margin: auto;
            width: 100%;
            position: relative;
            z-index: 5;
        }

        #header h1,
        #header h2,
        #header p {
            margin: 0;
            padding: 2vh 2vw;
            text-align: center;
        }

        #footer {
            width: 100%;
            min-height: 5vh;
            padding-top: 2vh;
            padding-bottom: 2vh;
            text-align: center;
            line-height: 25px;
            font-size: 13px;
            position: relative;
            z-index: 5;

        }

        #features {
            padding-top: 10vh;
            padding-bottom: 10vh;
        }

        .hidden {
            visibility: hidden;
        }

        .centered {
            width: 50vw;
            margin: 0 auto;
        }

        .lefty {
            /*width: 33vw;*/
            width: 40vw;
            margin-left: 5vw;
        }
        .righty {
            /*width: 33vw;*/
            /*margin-left: 62vw;*/
            width: 40vw;
            margin-left: 55vw;
        }

        .fully {
            width: 100%;
            margin: auto;
        }

        .light {
            color: #292929;
            background-color: #ffffff;
        }

        .dark {
            color: #fafafa;
            background-color: #020202;
        }
        h1 {
            font-size: 2.5em;
        }
        h2 {
            font-size: 2em;
        }
        h3 {
            font-size: 2em;
        }

        .step {
            padding-bottom: 50vh;
            /* margin-bottom: 10vh; */
            opacity: 0.25;
        }

        .step.active {
            opacity: 0.9;
        }

        .step div {
            padding: 25px 50px;
            line-height: 35px;
            font-size: 1.3em;
        }

        .step img {
            width: 100%;
        }
        /* ---------- Chapter navigation rail (right edge) ---------- */
        #chapter-nav {
            position: fixed;
            right: 28px;
            top: 50%;
            transform: translateY(-50%);
            height: min(56vh, 440px);
            width: 22px;
            z-index: 10;
        }
        .nav-track {
            position: relative;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }
        .nav-line, .nav-fill {
            position: absolute;
            left: 50%;
            width: 2px;
            margin-left: -1px;
            top: 11px;
        }
        .nav-line {
            bottom: 11px;
            background: rgba(31, 31, 31, 0.35);
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.6);   /* stays visible on the dark globe */
        }
        .nav-fill {
            height: calc((100% - 22px) * var(--progress, 0));
            background: #1f1f1f;
            transition: height 0.3s, width 0.3s;
        }
        .nav-dot {
            position: relative;
            width: 22px;
            height: 22px;
            padding: 0;
            border: none;
            background: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .nav-dot::before {
            content: '';
            width: 10px;
            height: 10px;
            border-radius: 50%;
            box-sizing: border-box;
            background: #fff;
            border: 2px solid #1f1f1f;
            transition: transform 0.15s;
        }
        .nav-dot.past::before {
            background: #1f1f1f;
        }
        .nav-dot.active::before {
            width: 14px;
            height: 14px;
            background: #1f1f1f;
            box-shadow: 0 0 0 2px #fff;
        }
        .nav-dot:hover::before,
        .nav-dot:focus-visible::before {
            transform: scale(1.3);
        }
        .nav-tip {
            position: absolute;
            right: 28px;
            top: 50%;
            transform: translateY(-50%);
            white-space: nowrap;
            background: #1f1f1f;
            color: #fff;
            font-size: 14px;
            line-height: 1.3;
            padding: 4px 9px;
            border-radius: 4px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.15s;
        }
        .nav-dot:hover .nav-tip,
        .nav-dot:focus-visible .nav-tip {
            opacity: 1;
        }
        .nav-dot.active .nav-tip {
            display: none;   /* the caption already names the current chapter */
        }
        /* caption beside the active dot: map title + legend */
        .nav-caption {
            position: absolute;
            right: 34px;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 8px 12px;
            border-radius: 5px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.15);
            white-space: nowrap;
            pointer-events: none;
            font-size: 1.15em;
            line-height: 1.4;
            transition: top 0.3s, opacity 0.2s;
        }
        .nav-caption.empty {
            opacity: 0;
        }
        #chapter-nav:has(.nav-dot:not(.active):hover) .nav-caption {
            opacity: 0.15;   /* fade so the hover label is readable */
        }
        .nav-title {
            font-style: italic;
        }
        .nav-legend > div {
            display: flex;
            align-items: center;
            font-size: 0.85em;
            margin-top: 4px;
        }
        .nav-legend span {
            display: inline-block;
            width: 12px;
            height: 12px;
            margin-right: 8px;
            border: 1px solid #000;
        }

        @media (max-width: 750px) {

            .centered,
            .lefty,
            .righty,
            .fully {
                width: 90vw;
                margin: 0 auto;
            }
            /*h1 {*/
            /*    font-size: 2.5em;*/
            /*}*/
            /*h2 {*/
            /*    font-size: 2em;*/
            /*}*/
            /*h3 {*/
            /*    font-size: 2em;*/
            /*}*/
            .step div {
                line-height: 25px;
                font-size: 1em;
            }
            /* chapter nav becomes a compact pill at the bottom */
            #chapter-nav {
                top: auto;
                bottom: 14px;
                right: auto;
                left: 50%;
                transform: translateX(-50%);
                height: auto;
                width: auto;
                display: flex;
                flex-direction: column;
                align-items: center;
                background: rgba(255, 255, 255, 0.95);
                border-radius: 16px;
                padding: 6px 14px;
                box-shadow: 0 1px 2px rgba(0, 0, 0, 0.15);
            }
            .nav-track {
                flex-direction: row;
                width: 210px;
                height: 22px;
            }
            .nav-line, .nav-fill {
                top: 50%;
                left: 11px;
                width: auto;
                height: 2px;
                margin: -1px 0 0 0;
            }
            .nav-line {
                right: 11px;
                bottom: auto;
            }
            .nav-fill {
                width: calc((100% - 22px) * var(--progress, 0));
            }
            .nav-tip {
                display: none;
            }
            .nav-caption {
                position: static;
                transform: none;
                background: none;
                box-shadow: none;
                padding: 0 0 2px;
                font-size: 0.95em;
                text-align: center;
            }
            .nav-caption.empty {
                display: none;
            }
            .nav-legend {
                display: flex;
                justify-content: center;
                gap: 12px;
            }

        }

        /* Fix issue on mobile browser where scroll breaks  */
        .mapboxgl-canvas-container.mapboxgl-touch-zoom-rotate.mapboxgl-touch-drag-pan,
        .mapboxgl-canvas-container.mapboxgl-touch-zoom-rotate.mapboxgl-touch-drag-pan .mapboxgl-canvas {
            touch-action: unset;
        }
        /* let mouse events fall through to the map... */
        #story, #features, .step {
            pointer-events: none;
        }
        /* ...except on the visible text cards, header and footer */
        .step > div, #header, #footer {
            pointer-events: auto;
        }
        /* give the +/− zoom buttons some room from the window edge */
        .mapboxgl-ctrl-top-right .mapboxgl-ctrl {
            margin: 24px 24px 0 0;
        }
    </style>
</head>

<body>

    <div id="map"></div>
    <div id="story"></div>
    <nav id="chapter-nav" aria-label="Chapters">
        <div class="nav-caption empty" aria-live="polite"></div>
        <div class="nav-track">
            <div class="nav-line"></div>
            <div class="nav-fill"></div>
        </div>
    </nav>

    <script src="./config.js"></script>
    <script>
        var initLoad = true;
        var layerTypes = {
            'fill': ['fill-opacity'],
            'line': ['line-opacity'],
            'circle': ['circle-opacity', 'circle-stroke-opacity'],
            'symbol': ['icon-opacity', 'text-opacity'],
            'raster': ['raster-opacity'],
            'fill-extrusion': ['fill-extrusion-opacity'],
            'heatmap': ['heatmap-opacity']
        }

        var alignments = {
            'left': 'lefty',
            'center': 'centered',
            'right': 'righty',
            'full': 'fully'
        }

        function getLayerPaintType(layer) {
            var mapLayer = map.getLayer(layer);
            if (!mapLayer) {
                console.error(`Layer "${layer}" does not exist.`);
                return null;
            }
            var layerType = mapLayer.type;
            return layerTypes[layerType];
        }

        function setLayerOpacity(layer) {
            var paintProps = getLayerPaintType(layer.layer);
            paintProps.forEach(function (prop) {
                var options = {};
                if (layer.duration) {
                    var transitionProp = prop + "-transition";
                    options = { "duration": layer.duration };
                    map.setPaintProperty(layer.layer, transitionProp, options);
                }
                map.setPaintProperty(layer.layer, prop, layer.opacity, options);
            });
        }


        var story = document.getElementById('story');
        var features = document.createElement('div');
        features.setAttribute('id', 'features');

        var header = document.createElement('div');

        if (config.title) {
            var titleText = document.createElement('h1');
            titleText.innerText = config.title;
            header.appendChild(titleText);
        }

        if (config.subtitle) {
            var subtitleText = document.createElement('h2');
            subtitleText.innerText = config.subtitle;
            header.appendChild(subtitleText);
        }

        if (config.byline) {
            var bylineText = document.createElement('p');
            bylineText.innerHTML = config.byline;
            header.appendChild(bylineText);
        }

        if (header.innerText.length > 0) {
            header.classList.add(config.theme);
            header.setAttribute('id', 'header');
            story.appendChild(header);
        }

        config.chapters.forEach((record, idx) => {
            var container = document.createElement('div');
            var chapter = document.createElement('div');

            if (record.title) {
                var title = document.createElement('h3');
                title.innerText = record.title;
                chapter.appendChild(title);
            }

            if (record.subtitle) {
                var subtitle = document.createElement('h4');
                subtitle.innerText = record.subtitle;
                chapter.appendChild(subtitle);
            }

            if (record.image) {
                var image = new Image();
                image.src = record.image;
                chapter.appendChild(image);
            }

            if (record.description) {
                var story = document.createElement('p');
                story.innerHTML = record.description;
                chapter.appendChild(story);
            }

            container.setAttribute('id', record.id);
            container.classList.add('step');
            if (idx === 0) {
                container.classList.add('active');
            }

            chapter.classList.add(config.theme);
            container.appendChild(chapter);
            container.classList.add(alignments[record.alignment] || 'centered');
            if (record.hidden) {
                container.classList.add('hidden');
            }
            features.appendChild(container);
        });

        story.appendChild(features);

        // ---------- Chapter navigation rail ----------
        // One dot per (non-hidden) chapter; hover shows the chapter title, click scrolls there.
        // The caption beside the active dot shows the chapter's mapTitle and legend from config.js.
        var chapterNav = document.getElementById('chapter-nav');
        var navTrack = chapterNav.querySelector('.nav-track');
        var navCaption = chapterNav.querySelector('.nav-caption');
        var navChapters = config.chapters.filter(function (c) { return !c.hidden; });
        var navDots = navChapters.map(function (c) {
            var dot = document.createElement('button');
            dot.type = 'button';
            dot.className = 'nav-dot';
            dot.setAttribute('aria-label', c.title);
            var tip = document.createElement('span');
            tip.className = 'nav-tip';
            tip.textContent = c.title;
            dot.appendChild(tip);
            dot.addEventListener('click', function () {
                var step = document.getElementById(c.id);
                // land with the card near the top; scrollama then fires this chapter
                var top = step.getBoundingClientRect().top + window.scrollY - window.innerHeight * 0.15;
                window.scrollTo({ top: top, behavior: 'smooth' });
            });
            navTrack.appendChild(dot);
            return dot;
        });

        function setNav(chapterId) {
            var idx = navChapters.findIndex(function (c) { return c.id === chapterId; });
            if (idx < 0) return;
            var c = navChapters[idx];
            navDots.forEach(function (dot, i) {
                dot.classList.toggle('active', i === idx);
                dot.classList.toggle('past', i < idx);
                if (i === idx) dot.setAttribute('aria-current', 'step'); else dot.removeAttribute('aria-current');
            });
            chapterNav.style.setProperty('--progress', navDots.length > 1 ? idx / (navDots.length - 1) : 0);

            navCaption.innerHTML = '';
            var items = c.legend || [];
            if (c.mapTitle) {
                var title = document.createElement('div');
                title.className = 'nav-title';
                title.textContent = c.mapTitle;
                navCaption.appendChild(title);
            }
            if (items.length > 0) {
                var legend = document.createElement('div');
                legend.className = 'nav-legend';
                items.forEach(function (item) {
                    var row = document.createElement('div');
                    var swatch = document.createElement('span');
                    swatch.style.backgroundColor = item.color;
                    row.appendChild(swatch);
                    row.appendChild(document.createTextNode(item.layer));
                    legend.appendChild(row);
                });
                navCaption.appendChild(legend);
            }
            navCaption.classList.toggle('empty', !c.mapTitle && items.length === 0);
            var dot = navDots[idx];
            navCaption.style.top = (dot.offsetTop + dot.offsetHeight / 2) + 'px';   // sit beside the active dot
        }
        setNav(navChapters[0].id);

        var footer = document.createElement('div');

        if (config.footer) {
            var footerText = document.createElement('p');
            footerText.innerHTML = config.footer;
            footer.appendChild(footerText);
        }

        if (footer.innerText.length > 0) {
            footer.classList.add("dark");
            footer.setAttribute('id', 'footer');
            story.appendChild(footer);
        }

        mapboxgl.accessToken = config.accessToken;

        var map = new mapboxgl.Map({
            container: 'map',
            style: config.style,
            center: config.chapters[0].location.center,
            zoom: config.chapters[0].location.zoom,
            bearing: config.chapters[0].location.bearing,
            pitch: config.chapters[0].location.pitch,
            // interactive: false,
            interactive: true,
            scrollZoom: false,        // mouse wheel keeps scrolling the story
            doubleClickZoom: false,
            boxZoom: false,
            keyboard: false,
            dragPan: true,            // click-drag spins the globe
            dragRotate: false,        // set true to also allow right-drag tilt/bearing
            touchZoomRotate: false,
            minZoom: 1,               // keep readers from zooming out too far
            maxZoom: 8,               // ...or in too far (chapters use 2.3–7)
            projection: config.projection
        });

        // +/− zoom buttons
        map.addControl(
            new mapboxgl.NavigationControl({ showCompass: false }),
            'top-right'
        );

        // Ctrl/⌘ + wheel (and trackpad pinch, which browsers report as Ctrl + wheel)
        // zooms the map; a plain wheel/swipe keeps scrolling the story.
        map.getCanvasContainer().addEventListener('wheel', function (e) {
            if (!(e.ctrlKey || e.metaKey)) return;
            e.preventDefault();               // stop the browser's own page zoom
            var z = map.getZoom() - e.deltaY * 0.01;
            z = Math.max(map.getMinZoom(), Math.min(map.getMaxZoom(), z));
            map.easeTo({
                zoom: z,
                around: map.unproject([e.offsetX, e.offsetY]),   // zoom toward the cursor
                duration: 0
            });
        }, { passive: false });

        map.on('style.load', () => {
            // Hide administrative boundaries
            map.setConfigProperty('basemap', 'showAdminBoundaries', false);
        });
        // Create a inset map if enabled in config.js
        if (config.inset) {
            map.addControl(
                new GlobeMinimap({ ...config.insetOptions }),
                config.insetPosition
            );
        }

        if (config.showMarkers) {
            var marker = new mapboxgl.Marker({ color: config.markerColor });
            marker.setLngLat(config.chapters[0].location.center).addTo(map);
        }

        // instantiate the scrollama
        var scroller = scrollama();


        map.on("load", function () {
            // map.addSource('example-source', {
            //     type: 'geojson',
            //     data: {
            //         type: 'FeatureCollection',
            //         features: [
            //             {
            //                 type: 'Feature',
            //                 geometry: {
            //                     type: 'Point',
            //                     coordinates: [32.64172, 36.93814]
            //                 },
            //                 properties: {
            //                     title: 'Example Point'
            //                 }
            //             }
            //         ]
            //     }
            // });
            //
            // map.addLayer({
            //     id: 'example-layer',
            //     type: 'circle',
            //     source: 'example-source',
            //     paint: {
            //         'circle-radius': 10,
            //         'circle-color': '#007cbf'
            //     }
            // });
            console.log('Available layers:', map.getStyle().layers);
            if (config.use3dTerrain) {
                map.addSource('mapbox-dem', {
                    'type': 'raster-dem',
                    'url': 'mapbox://mapbox.mapbox-terrain-dem-v1',
                    'tileSize': 512,
                    'maxzoom': 14
                });
                // add the DEM source as a terrain layer with exaggerated height
                map.setTerrain({ 'source': 'mapbox-dem', 'exaggeration': 1.5 });

                // add a sky layer that will show when the map is highly pitched
                map.addLayer({
                    'id': 'sky',
                    'type': 'sky',
                    'paint': {
                        'sky-type': 'atmosphere',
                        'sky-atmosphere-sun': [0.0, 0.0],
                        'sky-atmosphere-sun-intensity': 15
                    }
                });
            };
            // Globe spin (chapters with spinAnimation: true).
            // Each 1-second step starts only when the previous one ends ('moveend'),
            // so window resizes or zoom clicks never pile up competing animations.
            // The spin pauses while the reader drags the globe and resumes afterwards.
            const SPIN_SECONDS_PER_TURN = 180;
            let spinning = false;
            let userInteracting = false;

            function spinStep() {
                if (!spinning || userInteracting || map.isEasing()) return;
                const center = map.getCenter();
                center.lng -= 360 / SPIN_SECONDS_PER_TURN;   // degrees per 1-second step
                map.easeTo({ center: center, duration: 1000, easing: (t) => t });
            }

            // Chapter camera: left-aligned cards cover the left ~45% of the screen, so pad the
            // map on that side. Each chapter's `center` is then the region's true center and
            // Mapbox places it in the middle of the open map. Phones (cards full width) get no padding.
            function chapterCamera(chapter) {
                var w = map.getContainer().clientWidth;
                var left = (chapter.alignment === 'left' && w > 750) ? Math.round(w * 0.45) : 0;
                return Object.assign({}, chapter.location, {
                    padding: { left: left, right: 0, top: 0, bottom: 0 }
                });
            }

            let spinPending = null;     // chapter element waiting for its fly-in to finish
            let currentChapter = null;
            let restarting = false;

            map.on('moveend', () => {
                if (restarting) return;
                if (spinPending) {
                    if (spinPending.classList.contains('active')) spinning = true;
                    spinPending = null;
                }
                spinStep();
            });

            // Mapbox animations jump if the window is resized mid-animation
            // (they keep using the old window size). Restart them from the current view.
            // Also re-apply the left padding, since it's a share of the window width.
            map.on('resize', () => {
                const wasEasing = map.isEasing();
                restarting = true;
                if (wasEasing) map.stop();
                if (currentChapter) map.setPadding(chapterCamera(currentChapter).padding);
                restarting = false;
                if (spinning) {
                    spinStep();
                } else if (wasEasing && currentChapter) {
                    map[currentChapter.mapAnimation || 'flyTo'](chapterCamera(currentChapter));
                }
                setNav(currentChapter ? currentChapter.id : navChapters[0].id);   // caption follows the dot's new spot
            });
            map.on('mousedown', () => { userInteracting = true; });
            map.on('touchstart', () => { userInteracting = true; });
            map.on('dragend', () => { userInteracting = false; spinStep(); });
            window.addEventListener('mouseup', () => {
                if (userInteracting) { userInteracting = false; spinStep(); }
            });
            window.addEventListener('touchend', () => {
                if (userInteracting) { userInteracting = false; spinStep(); }
            });
// setup the instance, pass callback functions
            scroller
                .setup({
                    step: '.step',
                    offset: 0.5,
                    progress: true
                })
                .onStepEnter(async response => {
                    spinning = false;   // stop any spin before moving to the new chapter
                    spinPending = null;

                    var current_chapter = config.chapters.findIndex(chap => chap.id === response.element.id);
                    var chapter = config.chapters[current_chapter];

                    response.element.classList.add('active');
                    currentChapter = chapter;
                    map[chapter.mapAnimation || 'flyTo'](chapterCamera(chapter));

                    if (config.showMarkers) {
                        marker.setLngLat(chapter.location.center);
                    }
                    if (chapter.onChapterEnter.length > 0) {
                        chapter.onChapterEnter.forEach(setLayerOpacity);
                    }
                    if (chapter.callback) {
                        window[chapter.callback]();
                    }
                    if (chapter.rotateAnimation) {
                        map.once('moveend', () => {
                            const rotateNumber = map.getBearing();
                            map.rotateTo(rotateNumber + 180, {
                                duration: 30000, easing: function (t) {
                                    return t;
                                }
                            });
                        });
                    }

                    if (chapter.spinAnimation) {
                        // start spinning once the fly-in to this chapter has finished
                        spinPending = response.element;
                    }

                    if (chapter.onChapterEnter.length > 0) {
                        chapter.onChapterEnter.forEach(setLayerOpacity);
                    }


                    setNav(chapter.id);   // move the rail and caption to this chapter
                    if (config.auto) {
                        var next_chapter = (current_chapter + 1) % config.chapters.length;
                        map.once('moveend', () => {
                            document.querySelectorAll('[data-scrollama-index="' + next_chapter.toString() + '"]')[0].scrollIntoView();
                        });
                    }
                })
                .onStepExit(response => {
                    var chapter = config.chapters.find(chap => chap.id === response.element.id);
                    response.element.classList.remove('active');
                    if (chapter.onChapterExit.length > 0) {
                        chapter.onChapterExit.forEach(setLayerOpacity);
                    }
                });


            if (config.auto) {
                document.querySelectorAll('[data-scrollama-index="0"]')[0].scrollIntoView();
            }
        });    

    </script>

</body>

</html>
