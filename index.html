<!DOCTYPE html>
<html>

<head>
    <meta charset='utf-8' />
    <title>Mapbox Storytelling</title>
    <meta name='viewport' content='initial-scale=1,maximum-scale=1,user-scalable=no' />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@400;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon"
        href="https://raw.githubusercontent.com/mapbox/assembly/publisher-staging/src/svgs/mapbox.svg">
<!--    <script src='https://api.tiles.mapbox.com/mapbox-gl-js/v3.8.0/mapbox-gl.js'></script>-->
<!--    <link href='https://api.tiles.mapbox.com/mapbox-gl-js/v3.8.0/mapbox-gl.css' rel='stylesheet' />-->
    <script src='https://api.tiles.mapbox.com/mapbox-gl-js/v3.18.1/mapbox-gl.js'></script>
    <link href='https://api.tiles.mapbox.com/mapbox-gl-js/v3.18.1/mapbox-gl.css' rel='stylesheet' />
    <script src="https://cdn.jsdelivr.net/npm/mapbox-gl-globe-minimap@1.2.0/dist/bundle.js"></script>
    <script src="https://unpkg.com/scrollama"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Newsreader", "Newsreader Fallback", serif;
        }

        h1, h2, h3, h4#footer {
            font-family: 'Playfair Display', serif;
        }

        h4 {
            font-weight: lighter !important;
            font-style: italic;
        }

        a.mapboxgl-ctrl-logo {
            display: none !important;
        }
        a:hover,
        a:visited {
            color: #0071bc;
        }

        #map {
            top: 0;
            height: 100vh;
            width: 100vw;
            position: fixed;
        }

        #header {
            margin: auto;
            width: 100%;
            position: relative;
            z-index: 5;
        }

        #header h1,
        #header h2,
        #header p {
            margin: 0;
            padding: 2vh 2vw;
            text-align: center;
        }

        #footer {
            width: 100%;
            min-height: 5vh;
            padding-top: 2vh;
            padding-bottom: 2vh;
            text-align: center;
            line-height: 25px;
            font-size: 13px;
            position: relative;
            z-index: 5;

        }

        #features {
            padding-top: 10vh;
            padding-bottom: 10vh;
        }

        .hidden {
            visibility: hidden;
        }

        .centered {
            width: 50vw;
            margin: 0 auto;
        }

        .lefty {
            /*width: 33vw;*/
            width: 40vw;
            margin-left: 5vw;
        }
        .righty {
            /*width: 33vw;*/
            /*margin-left: 62vw;*/
            width: 40vw;
            margin-left: 55vw;
        }

        .fully {
            width: 100%;
            margin: auto;
        }

        .light {
            color: #292929;
            background-color: #ffffff;
        }

        .dark {
            color: #fafafa;
            background-color: #020202;
        }
        h1 {
            font-size: 2.5em;
        }
        h2 {
            font-size: 2em;
        }
        h3 {
            font-size: 2em;
        }

        .step {
            padding-bottom: 50vh;
            /* margin-bottom: 10vh; */
            opacity: 0.25;
        }

        .step.active {
            opacity: 0.9;
        }

        .step div {
            padding: 25px 50px;
            line-height: 35px;
            font-size: 1.3em;
        }

        .step img {
            width: 100%;
        }
        .map-legend {
            position: fixed; /* Change to fixed positioning */
            bottom: 20px;
            right: 20px;
            background: white;
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
            /*font-family: Arial, sans-serif;*/
            font-size: 1.5em;
            line-height: 30px;
            z-index: 10; /* Ensure it stays above other elements */
            pointer-events: none; /* Prevent interaction issues */
            display: none;
        }

        .map-legend h4 {
            margin: 0 0 5px;
        }

        /* chapters whose text card is on the right get the box on the left instead */
        .map-legend.on-left {
            right: auto;
            left: 20px;
            bottom: 40px;   /* clear the Mapbox logo */
        }

        .map-legend .map-title:only-child {
            margin: 0;   /* no gap below the title when there's no legend under it */
        }

        .map-legend div {
            display: flex;
            align-items: center;
            margin-bottom: 5px;
        }

        .map-legend span {
            display: inline-block;
            width: 12px;
            height: 12px;
            margin-right: 8px;
            border: 1px solid #000;
        }

        @media (max-width: 750px) {

            .centered,
            .lefty,
            .righty,
            .fully {
                width: 90vw;
                margin: 0 auto;
            }
            /*h1 {*/
            /*    font-size: 2.5em;*/
            /*}*/
            /*h2 {*/
            /*    font-size: 2em;*/
            /*}*/
            /*h3 {*/
            /*    font-size: 2em;*/
            /*}*/
            .step div {
                line-height: 25px;
                font-size: 1em;
            }
            .map-legend {
                display: none !important;
            }

        }

        /* Fix issue on mobile browser where scroll breaks  */
        .mapboxgl-canvas-container.mapboxgl-touch-zoom-rotate.mapboxgl-touch-drag-pan,
        .mapboxgl-canvas-container.mapboxgl-touch-zoom-rotate.mapboxgl-touch-drag-pan .mapboxgl-canvas {
            touch-action: unset;
        }
        /* let mouse events fall through to the map... */
        #story, #features, .step {
            pointer-events: none;
        }
        /* ...except on the visible text cards, header and footer */
        .step > div, #header, #footer {
            pointer-events: auto;
        }
        /* give the +/− zoom buttons some room from the window edge */
        .mapboxgl-ctrl-top-right .mapboxgl-ctrl {
            margin: 24px 24px 0 0;
        }
    </style>
</head>

<body>

    <div id="map"></div>
    <div id="story"></div>
    <div id="map-legend" class="map-legend">
<!--        <h4>Legend</h4>-->
<!--        <div><span style="background-color: #007cbf;"></span> Example Layer</div>-->
    </div>

    <script src="./config.js"></script>
    <script>
        var initLoad = true;
        var layerTypes = {
            'fill': ['fill-opacity'],
            'line': ['line-opacity'],
            'circle': ['circle-opacity', 'circle-stroke-opacity'],
            'symbol': ['icon-opacity', 'text-opacity'],
            'raster': ['raster-opacity'],
            'fill-extrusion': ['fill-extrusion-opacity'],
            'heatmap': ['heatmap-opacity']
        }

        var alignments = {
            'left': 'lefty',
            'center': 'centered',
            'right': 'righty',
            'full': 'fully'
        }

        function getLayerPaintType(layer) {
            var mapLayer = map.getLayer(layer);
            if (!mapLayer) {
                console.error(`Layer "${layer}" does not exist.`);
                return null;
            }
            var layerType = mapLayer.type;
            return layerTypes[layerType];
        }

        function setLayerOpacity(layer) {
            var paintProps = getLayerPaintType(layer.layer);
            paintProps.forEach(function (prop) {
                var options = {};
                if (layer.duration) {
                    var transitionProp = prop + "-transition";
                    options = { "duration": layer.duration };
                    map.setPaintProperty(layer.layer, transitionProp, options);
                }
                map.setPaintProperty(layer.layer, prop, layer.opacity, options);
            });
        }


        function setLegend(layer){
            console.log(layer);
            const legend = document.getElementById('map-legend');




                const item = document.createElement('div');
                const colorBox = document.createElement('span');
                colorBox.style.backgroundColor = layer.color;
                item.appendChild(colorBox);
                item.appendChild(document.createTextNode(layer.layer));
                legend.appendChild(item);

        }

        var story = document.getElementById('story');
        var features = document.createElement('div');
        features.setAttribute('id', 'features');

        var header = document.createElement('div');

        if (config.title) {
            var titleText = document.createElement('h1');
            titleText.innerText = config.title;
            header.appendChild(titleText);
        }

        if (config.subtitle) {
            var subtitleText = document.createElement('h2');
            subtitleText.innerText = config.subtitle;
            header.appendChild(subtitleText);
        }

        if (config.byline) {
            var bylineText = document.createElement('p');
            bylineText.innerHTML = config.byline;
            header.appendChild(bylineText);
        }

        if (header.innerText.length > 0) {
            header.classList.add(config.theme);
            header.setAttribute('id', 'header');
            story.appendChild(header);
        }

        config.chapters.forEach((record, idx) => {
            var container = document.createElement('div');
            var chapter = document.createElement('div');

            if (record.title) {
                var title = document.createElement('h3');
                title.innerText = record.title;
                chapter.appendChild(title);
            }

            if (record.subtitle) {
                var subtitle = document.createElement('h4');
                subtitle.innerText = record.subtitle;
                chapter.appendChild(subtitle);
            }

            if (record.image) {
                var image = new Image();
                image.src = record.image;
                chapter.appendChild(image);
            }

            if (record.description) {
                var story = document.createElement('p');
                story.innerHTML = record.description;
                chapter.appendChild(story);
            }

            container.setAttribute('id', record.id);
            container.classList.add('step');
            if (idx === 0) {
                container.classList.add('active');
            }

            chapter.classList.add(config.theme);
            container.appendChild(chapter);
            container.classList.add(alignments[record.alignment] || 'centered');
            if (record.hidden) {
                container.classList.add('hidden');
            }
            features.appendChild(container);
        });

        story.appendChild(features);

        var footer = document.createElement('div');

        if (config.footer) {
            var footerText = document.createElement('p');
            footerText.innerHTML = config.footer;
            footer.appendChild(footerText);
        }

        if (footer.innerText.length > 0) {
            footer.classList.add("dark");
            footer.setAttribute('id', 'footer');
            story.appendChild(footer);
        }

        mapboxgl.accessToken = config.accessToken;

        var map = new mapboxgl.Map({
            container: 'map',
            style: config.style,
            center: config.chapters[0].location.center,
            zoom: config.chapters[0].location.zoom,
            bearing: config.chapters[0].location.bearing,
            pitch: config.chapters[0].location.pitch,
            // interactive: false,
            interactive: true,
            scrollZoom: false,        // mouse wheel keeps scrolling the story
            doubleClickZoom: false,
            boxZoom: false,
            keyboard: false,
            dragPan: true,            // click-drag spins the globe
            dragRotate: false,        // set true to also allow right-drag tilt/bearing
            touchZoomRotate: false,
            minZoom: 1,               // keep readers from zooming out too far
            maxZoom: 8,               // ...or in too far (chapters use 2.3–7)
            projection: config.projection
        });

        // +/− zoom buttons
        map.addControl(
            new mapboxgl.NavigationControl({ showCompass: false }),
            'top-right'
        );

        // Ctrl/⌘ + wheel (and trackpad pinch, which browsers report as Ctrl + wheel)
        // zooms the map; a plain wheel/swipe keeps scrolling the story.
        map.getCanvasContainer().addEventListener('wheel', function (e) {
            if (!(e.ctrlKey || e.metaKey)) return;
            e.preventDefault();               // stop the browser's own page zoom
            var z = map.getZoom() - e.deltaY * 0.01;
            z = Math.max(map.getMinZoom(), Math.min(map.getMaxZoom(), z));
            map.easeTo({
                zoom: z,
                around: map.unproject([e.offsetX, e.offsetY]),   // zoom toward the cursor
                duration: 0
            });
        }, { passive: false });

        map.on('style.load', () => {
            // Hide administrative boundaries
            map.setConfigProperty('basemap', 'showAdminBoundaries', false);
        });
        // Create a inset map if enabled in config.js
        if (config.inset) {
            map.addControl(
                new GlobeMinimap({ ...config.insetOptions }),
                config.insetPosition
            );
        }

        if (config.showMarkers) {
            var marker = new mapboxgl.Marker({ color: config.markerColor });
            marker.setLngLat(config.chapters[0].location.center).addTo(map);
        }

        // instantiate the scrollama
        var scroller = scrollama();


        map.on("load", function () {
            // map.addSource('example-source', {
            //     type: 'geojson',
            //     data: {
            //         type: 'FeatureCollection',
            //         features: [
            //             {
            //                 type: 'Feature',
            //                 geometry: {
            //                     type: 'Point',
            //                     coordinates: [32.64172, 36.93814]
            //                 },
            //                 properties: {
            //                     title: 'Example Point'
            //                 }
            //             }
            //         ]
            //     }
            // });
            //
            // map.addLayer({
            //     id: 'example-layer',
            //     type: 'circle',
            //     source: 'example-source',
            //     paint: {
            //         'circle-radius': 10,
            //         'circle-color': '#007cbf'
            //     }
            // });
            console.log('Available layers:', map.getStyle().layers);
            if (config.use3dTerrain) {
                map.addSource('mapbox-dem', {
                    'type': 'raster-dem',
                    'url': 'mapbox://mapbox.mapbox-terrain-dem-v1',
                    'tileSize': 512,
                    'maxzoom': 14
                });
                // add the DEM source as a terrain layer with exaggerated height
                map.setTerrain({ 'source': 'mapbox-dem', 'exaggeration': 1.5 });

                // add a sky layer that will show when the map is highly pitched
                map.addLayer({
                    'id': 'sky',
                    'type': 'sky',
                    'paint': {
                        'sky-type': 'atmosphere',
                        'sky-atmosphere-sun': [0.0, 0.0],
                        'sky-atmosphere-sun-intensity': 15
                    }
                });
            };
            // Globe spin (chapters with spinAnimation: true).
            // Each 1-second step starts only when the previous one ends ('moveend'),
            // so window resizes or zoom clicks never pile up competing animations.
            // The spin pauses while the reader drags the globe and resumes afterwards.
            const SPIN_SECONDS_PER_TURN = 180;
            let spinning = false;
            let userInteracting = false;

            function spinStep() {
                if (!spinning || userInteracting || map.isEasing()) return;
                const center = map.getCenter();
                center.lng -= 360 / SPIN_SECONDS_PER_TURN;   // degrees per 1-second step
                map.easeTo({ center: center, duration: 1000, easing: (t) => t });
            }

            let spinPending = null;     // chapter element waiting for its fly-in to finish
            let currentChapter = null;
            let restarting = false;

            map.on('moveend', () => {
                if (restarting) return;
                if (spinPending) {
                    if (spinPending.classList.contains('active')) spinning = true;
                    spinPending = null;
                }
                spinStep();
            });

            // Mapbox animations jump if the window is resized mid-animation
            // (they keep using the old window size). Restart them from the current view.
            map.on('resize', () => {
                if (!map.isEasing()) return;
                restarting = true;
                map.stop();
                restarting = false;
                if (spinning) {
                    spinStep();
                } else if (currentChapter) {
                    map[currentChapter.mapAnimation || 'flyTo'](currentChapter.location);
                }
            });
            map.on('mousedown', () => { userInteracting = true; });
            map.on('touchstart', () => { userInteracting = true; });
            map.on('dragend', () => { userInteracting = false; spinStep(); });
            window.addEventListener('mouseup', () => {
                if (userInteracting) { userInteracting = false; spinStep(); }
            });
            window.addEventListener('touchend', () => {
                if (userInteracting) { userInteracting = false; spinStep(); }
            });
// setup the instance, pass callback functions
            scroller
                .setup({
                    step: '.step',
                    offset: 0.5,
                    progress: true
                })
                .onStepEnter(async response => {
                    spinning = false;   // stop any spin before moving to the new chapter
                    spinPending = null;

                    var current_chapter = config.chapters.findIndex(chap => chap.id === response.element.id);
                    var chapter = config.chapters[current_chapter];

                    response.element.classList.add('active');
                    currentChapter = chapter;
                    map[chapter.mapAnimation || 'flyTo'](chapter.location);

                    if (config.showMarkers) {
                        marker.setLngLat(chapter.location.center);
                    }
                    if (chapter.onChapterEnter.length > 0) {
                        chapter.onChapterEnter.forEach(setLayerOpacity);
                    }
                    if (chapter.callback) {
                        window[chapter.callback]();
                    }
                    if (chapter.rotateAnimation) {
                        map.once('moveend', () => {
                            const rotateNumber = map.getBearing();
                            map.rotateTo(rotateNumber + 180, {
                                duration: 30000, easing: function (t) {
                                    return t;
                                }
                            });
                        });
                    }

                    if (chapter.spinAnimation) {
                        // start spinning once the fly-in to this chapter has finished
                        spinPending = response.element;
                    }

                    if (chapter.onChapterEnter.length > 0) {
                        chapter.onChapterEnter.forEach(setLayerOpacity);
                    }


                    // Map title + legend box (bottom right). Shows the chapter's mapTitle
                    // and, below it, any legend items; hidden if the chapter has neither.
                    var legendBox = document.getElementById('map-legend');
                    var legendItems = chapter.legend || [];
                    legendBox.innerHTML = '';
                    legendBox.classList.toggle('on-left', chapter.alignment === 'right');  // keep it off the text card
                    if (chapter.mapTitle || legendItems.length > 0) {
                        if (chapter.mapTitle) {
                            var mapTitle = document.createElement('h4');
                            mapTitle.className = 'map-title';
                            mapTitle.textContent = chapter.mapTitle;
                            legendBox.appendChild(mapTitle);
                        }
                        legendItems.forEach(setLegend);
                        legendBox.style.display = 'block';
                    } else {
                        legendBox.style.display = 'none';
                    }
                    if (config.auto) {
                        var next_chapter = (current_chapter + 1) % config.chapters.length;
                        map.once('moveend', () => {
                            document.querySelectorAll('[data-scrollama-index="' + next_chapter.toString() + '"]')[0].scrollIntoView();
                        });
                    }
                })
                .onStepExit(response => {
                    var chapter = config.chapters.find(chap => chap.id === response.element.id);
                    response.element.classList.remove('active');
                    if (chapter.onChapterExit.length > 0) {
                        chapter.onChapterExit.forEach(setLayerOpacity);
                    }
                });


            if (config.auto) {
                document.querySelectorAll('[data-scrollama-index="0"]')[0].scrollIntoView();
            }
        });    

    </script>

</body>

</html>
